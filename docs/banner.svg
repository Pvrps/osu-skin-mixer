<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="osu! skin mixer: build one skin out of the best parts of many">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17131f"/>
      <stop offset="1" stop-color="#0d0c12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#ff66ab" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff66ab" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c66ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8c66ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff66ab" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>

    <!-- A slider track sweeping in from the right, ending on the mixed circle. -->
    <path d="M1320 250 C 1040 330, 760 300, 560 214 S 360 150, 300 160" fill="none" stroke="url(#track)" stroke-width="54" stroke-linecap="round" opacity="0.35"/>
    <path d="M1320 250 C 1040 330, 760 300, 560 214 S 360 150, 300 160" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="62" stroke-linecap="round"/>

    <!-- Three skins' worth of circles, overlapping into one. -->
    <g fill="none" stroke-width="12">
      <circle cx="176" cy="132" r="62" stroke="#5dd6ff" opacity="0.9"/>
      <circle cx="252" cy="132" r="62" stroke="#8c66ff" opacity="0.9"/>
      <circle cx="214" cy="198" r="62" stroke="#ff66ab" opacity="0.95"/>
    </g>
    <g opacity="0.22">
      <circle cx="176" cy="132" r="56" fill="#5dd6ff"/>
      <circle cx="252" cy="132" r="56" fill="#8c66ff"/>
      <circle cx="214" cy="198" r="56" fill="#ff66ab"/>
    </g>
    <circle cx="214" cy="156" r="15" fill="#ffffff"/>
    <circle cx="214" cy="156" r="96" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
    <circle cx="214" cy="156" r="124" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>

    <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
      <text x="400" y="150" font-size="72" font-weight="800" letter-spacing="-2" fill="#ffffff">osu! <tspan fill="#ff66ab">skin mixer</tspan></text>
      <text x="404" y="200" font-size="26" font-weight="500" fill="#b9b6cc">One skin, made from the best parts of all of yours.</text>

      <g font-size="17" font-weight="600">
        <rect x="404" y="228" width="126" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="467" y="252" text-anchor="middle" fill="#edecf4">mix &amp; match</text>
        <rect x="542" y="228" width="132" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="608" y="252" text-anchor="middle" fill="#edecf4">live preview</text>
        <rect x="686" y="228" width="110" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="741" y="252" text-anchor="middle" fill="#edecf4">recolour</text>
        <rect x="808" y="228" width="130" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="873" y="252" text-anchor="middle" fill="#edecf4">osu!lazer</text>
      </g>
    </g>
  </g>
</svg>
