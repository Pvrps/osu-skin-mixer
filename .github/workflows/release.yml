# Builds the app for Linux, Windows and macOS and attaches them to a GitHub release whenever the repository's
# owner pushes a tag like v0.2.0. A tag pushed by anyone else is ignored.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    if: github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            app/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test the interface
        working-directory: web
        run: |
          npm ci --no-fund --no-audit
          npm test
          npm run build

      # The interface is packed into the server, and the server goes into the app alongside the window.
      - name: Build the server
        shell: bash
        run: dotnet publish server -c Release -r "${{ matrix.runtime }}" -o app/server -p:Version="${GITHUB_REF_NAME#v}" --nologo

      # An AppImage on Linux, a portable .exe on Windows and a .dmg on macOS, each with everything inside it.
      - name: Build the app
        working-directory: app
        shell: bash
        run: |
          npm ci --no-fund --no-audit
          npx electron-builder --publish never -c.extraMetadata.version="${GITHUB_REF_NAME#v}"

      # The release says what the tag says. The tag is fetched again because a checkout leaves its message behind.
      - name: Take the release notes from the tag
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md

      # The files are named for their system and nothing else, so the README can link to the latest of each.
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            app/out/*.AppImage
            app/out/*.exe
            app/out/*.dmg
