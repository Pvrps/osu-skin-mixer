# Builds the standalone app for Linux and Windows and attaches both to a GitHub release
# whenever a tag like v0.2.0 is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test the UI
        working-directory: web
        run: |
          npm ci --no-fund --no-audit
          npm test
          npm run build

      - name: Build the app
        run: |
          version="${GITHUB_REF_NAME#v}"
          for target in linux-x64 win-x64; do
            dotnet publish server -c Release -r "$target" -o "dist/$target" -p:Version="$version" --nologo
          done

          tar -czf "osu-skin-mixer-$version-linux-x64.tar.gz" -C dist/linux-x64 osu-skin-mixer
          (cd dist/win-x64 && zip -q "../../osu-skin-mixer-$version-windows-x64.zip" osu-skin-mixer.exe)

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            osu-skin-mixer-*.tar.gz
            osu-skin-mixer-*.zip
